[terminal]
default_shell = "zsh"

# Match oh-my-tmux: splits + copy-mode
[keys]
split_horizontal = "prefix+minus"
split_vertical = "prefix+_"
copy_mode = ["prefix+enter", "prefix+["]
goto = "prefix+s"
settings = "prefix+shift+s"
detach = "prefix+d"
next_workspace = "prefix+tab"
previous_workspace = "prefix+shift+tab"
cycle_pane_next = ""
cycle_pane_previous = ""
# comma = tmux rename-window; Shift+, often arrives as '<' from terminals
rename_tab = "prefix+comma"
rename_workspace = ["prefix+shift+comma", "prefix+<"]

[ui]
agent_panel_sort = "spaces"
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
# herdr-automatic-rename owns new-tab names; skip herdr's prompt
prompt_new_tab_name = false

# host-metrics: whole-host load + memory on every space card
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  # ["branch", "git_status"],
  ["$host"],
]
