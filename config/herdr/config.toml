onboarding = false
[terminal]
default_shell = "zsh"

# Match oh-my-tmux: splits + copy-mode
[keys]
split_horizontal = "prefix+minus"
split_vertical = "prefix+_"
# prefix+[ is previous_tab; copy-mode keeps enter only
copy_mode = "prefix+enter"
# Built-in goto lists panes; tab-only picker is prefix+s via local.tab-goto-rs
goto = ""
settings = "prefix+shift+s"
detach = "prefix+d"
previous_tab = "prefix+["
next_tab = "prefix+]"
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
next_agent = "prefix+tab"
previous_agent = "prefix+shift+tab"
cycle_pane_next = ""
cycle_pane_previous = ""
# Built-in focus keeps zoom; shell cmds unzoom first
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
# confirm before close; see pane-close/ (local.pane-close)
close_pane = ""
# comma = tmux rename-window; Shift+, often arrives as '<' from terminals
rename_tab = "prefix+comma"
rename_workspace = ["prefix+shift+comma", "prefix+<"]

# Spatial focus with wrap. Vim keys and arrow keys share the same commands.
# Script lives next to this config (via symlink or copy).
# Resolve path from HERDR_CONFIG_PATH / XDG config, never a hard-coded dotfiles root.
[[keys.command]]
key = "prefix+h"
type = "shell"
command = "python3 \"$(dirname \"$(readlink -f \"${HERDR_CONFIG_PATH:-${XDG_CONFIG_HOME:-$HOME/.config}/herdr/config.toml}\")\")/pane-focus-wrap.py\" left"
description = "focus left (wrap)"

[[keys.command]]
key = "prefix+left"
type = "shell"
command = "python3 \"$(dirname \"$(readlink -f \"${HERDR_CONFIG_PATH:-${XDG_CONFIG_HOME:-$HOME/.config}/herdr/config.toml}\")\")/pane-focus-wrap.py\" left"
description = "focus left (wrap)"

[[keys.command]]
key = "prefix+j"
type = "shell"
command = "python3 \"$(dirname \"$(readlink -f \"${HERDR_CONFIG_PATH:-${XDG_CONFIG_HOME:-$HOME/.config}/herdr/config.toml}\")\")/pane-focus-wrap.py\" down"
description = "focus down (wrap)"

[[keys.command]]
key = "prefix+down"
type = "shell"
command = "python3 \"$(dirname \"$(readlink -f \"${HERDR_CONFIG_PATH:-${XDG_CONFIG_HOME:-$HOME/.config}/herdr/config.toml}\")\")/pane-focus-wrap.py\" down"
description = "focus down (wrap)"

[[keys.command]]
key = "prefix+k"
type = "shell"
command = "python3 \"$(dirname \"$(readlink -f \"${HERDR_CONFIG_PATH:-${XDG_CONFIG_HOME:-$HOME/.config}/herdr/config.toml}\")\")/pane-focus-wrap.py\" up"
description = "focus up (wrap)"

[[keys.command]]
key = "prefix+up"
type = "shell"
command = "python3 \"$(dirname \"$(readlink -f \"${HERDR_CONFIG_PATH:-${XDG_CONFIG_HOME:-$HOME/.config}/herdr/config.toml}\")\")/pane-focus-wrap.py\" up"
description = "focus up (wrap)"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "python3 \"$(dirname \"$(readlink -f \"${HERDR_CONFIG_PATH:-${XDG_CONFIG_HOME:-$HOME/.config}/herdr/config.toml}\")\")/pane-focus-wrap.py\" right"
description = "focus right (wrap)"

[[keys.command]]
key = "prefix+right"
type = "shell"
command = "python3 \"$(dirname \"$(readlink -f \"${HERDR_CONFIG_PATH:-${XDG_CONFIG_HOME:-$HOME/.config}/herdr/config.toml}\")\")/pane-focus-wrap.py\" right"
description = "focus right (wrap)"

[[keys.command]]
key = "prefix+x"
type = "plugin_action"
command = "local.pane-close.open"
description = "close pane (confirm y)"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "local.tab-goto-rs.open"
description = "tab goto (rust, tabs only, j/k)"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "local.action-palette.open"
description = "command palette (plugin actions)"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then printf '%s\n' 'Not a git repository.' 'Press any key to close.'; bash -c 'read -rsn1'; elif git diff --staged --quiet --ignore-submodules=dirty; then printf '%s\n' 'No staged changes.' 'Press any key to close.'; bash -c 'read -rsn1'; else git diff --staged --ignore-submodules=dirty | diffnav; fi"
description = "git diff --staged | diffnav"
width = "98%"
height = "96%"

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then printf '%s\n' 'Not a git repository.' 'Press any key to close.'; bash -c 'read -rsn1'; elif git diff --quiet --ignore-submodules=dirty; then printf '%s\n' 'No unstaged changes.' 'Press any key to close.'; bash -c 'read -rsn1'; else git diff --ignore-submodules=dirty | diffnav; fi"
description = "git diff | diffnav"
width = "98%"
height = "96%"

[ui]
agent_panel_sort = "spaces"
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
# herdr-automatic-rename owns new-tab names; skip herdr's prompt
prompt_new_tab_name = false

# host-metrics: whole-host load + memory on every space card
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["$host"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["state_text", "agent"],
]

[theme]
name = "rose-pine"
auto_switch = false
