id = "local.tab-goto-rs"
name = "Tab Goto (Rust)"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Session tab picker (tabs only), Rust port for faster startup."
platforms = ["linux", "macos"]

[[panes]]
id = "picker"
title = "goto"
placement = "popup"
# Size is computed dynamically in `tab-goto open` (content + terminal bounds).
command = ["sh", "run.sh", "picker"]

[[actions]]
id = "open"
title = "Open tab picker (rust)"
contexts = ["pane", "workspace"]
command = ["sh", "run.sh", "open"]
