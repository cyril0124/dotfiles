id = "local.tab-goto"
name = "Tab Goto"
version = "0.2.1"
min_herdr_version = "0.8.0"
description = "Session tab picker (tabs only) via stdlib curses j/k."
platforms = ["linux", "macos"]

[[panes]]
id = "picker"
title = "goto"
placement = "popup"
# Size is computed dynamically in open.py (content + terminal bounds).
# Stdlib-only startup; module mode reuses Python's bytecode cache.
command = ["python3", "-S", "-m", "picker"]

[[actions]]
id = "open"
title = "Open tab picker"
contexts = ["pane", "workspace"]
command = ["python3", "-S", "-m", "open"]
